<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <link rel="stylesheet" href="styles/tabs.css">
  <link rel="stylesheet" href="styles/forms.css">
</head>
<body>
  <div class="tabs">
    <div role="tablist" aria-label="Select authentication method">
      <button
        role="tab"
        aria-selected="true"
        aria-controls="panel-1"
        id="tab-1"
        tabindex="0">
        Sign in
      </button>
      <button
        role="tab"
        aria-selected="false"
        aria-controls="panel-2"
        id="tab-2"
        tabindex="-1">
        Sign up
      </button>
    </div>
    <div class="tab-panels">
      <div
        role="tabpanel"
        id="panel-1"
        tabindex="0"
        aria-labelledby="tab-1">
        <form class="form js-auth-form">
          <fieldset>
            <legend>Authorization form</legend>

            <p>
              <label for="email-auth">Email:</label>
              <input type="email" name="email" id="email-auth" required>
            </p>

            <p>
              <label for="password-auth">Password:</label>
              <input type="password" name="password" id="password-auth" required>
            </p>

            <button type="submit">Submit</button>
          </fieldset>
        </form>
      </div>
      <div
        role="tabpanel"
        id="panel-2"
        tabindex="0"
        aria-labelledby="tab-2"
        hidden>
        <form class="form js-register-form">
          <fieldset>
            <legend>Registration form</legend>

            <p>
              <label for="name">Name:</label>
              <input type="text" name="name" id="name" required>
            </p>

            <p>
              <label for="email-reg">Email:</label>
              <input type="email" name="email" id="email-reg" required>
            </p>

            <p>
              <label for="phone">Phone number:</label>
              <input type="tel" name="phone" id="phone" required>
            </p>

            <p>
              <label for="password-reg">Password:</label>
              <input type="password" name="password" class="password-input" id="password-reg" minlength="6" maxlength="14" required>
            </p>

            <p>
              <label for="password-confirm">Password confirmation:</label>
              <input type="password" name="password-confirm" class="password-confirm" id="password-confirm" required>
            </p>

            <p>
              <input type="checkbox" name="checkbox" id="checkbox" required>
              <label for="checkbox">I agree to the processing of my personal data *</label>
            </p>

            <button type="submit">Submit</button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>

<script src="scripts/forms.js"></script>
<script src="scripts/authentication-tabs.js"></script>
</body>
</html>
